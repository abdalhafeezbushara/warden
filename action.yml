name: "Warden"
description: "Run a command under Warden and fail the build on undisclosed egress or high risk."
branding:
  icon: "shield"
  color: "blue"
inputs:
  command:
    description: "The command to run under Warden (e.g. an agent or build step)."
    required: true
  policy:
    description: "Path to a Warden policy file (optional; default policy if omitted)."
    required: false
  max-risk:
    description: "Fail if the session risk score exceeds this (0-100)."
    required: false
    default: "40"
  fail-on-blocked:
    description: "Also fail if any egress destination was blocked."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Install bubblewrap (Linux enforcement)
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y bubblewrap || true
        fi
    - name: Install Warden
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Run under Warden
      shell: bash
      run: |
        POLICY_ARG=""
        if [ -n "${{ inputs.policy }}" ]; then POLICY_ARG="--policy ${{ inputs.policy }}"; fi
        warden run $POLICY_ARG -- ${{ inputs.command }} || true
    - name: Gate on egress and risk
      shell: bash
      run: |
        FAIL_ARG=""
        if [ "${{ inputs.fail-on-blocked }}" = "true" ]; then FAIL_ARG="--fail-on-blocked"; fi
        warden gate --max-risk ${{ inputs.max-risk }} $FAIL_ARG
