[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-agent"
version = "0.2.0"
description = "Least privilege and a flight recorder for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdalhafeez" }]
keywords = ["ai", "agents", "security", "sandbox", "least-privilege", "claude-code", "mcp"]
dependencies = []   # stdlib only, on purpose
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/abdalhafeezbushara/warden"
Issues = "https://github.com/abdalhafeezbushara/warden/issues"

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools]
packages = ["warden", "warden.dashboard"]

[tool.setuptools.package-data]
warden = ["dashboard/*"]
