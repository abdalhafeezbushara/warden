name: agent:aider
description: Driftward baseline for aider. Open-source pair-programming agent; provider depends on config.

filesystem:
  read:
    - .//**
    - ~/.gitconfig
    - ~/.config/git/**
    - ~/.aider/**
    - ~/.config/aider/**
  write:
    - .//**
    - /tmp/**
    - /private/tmp/**
    - ~/.aider/**
    - ~/.config/aider/**
  deny:
    - ~/.ssh/**
    - ~/.aws/**
    - ~/.gnupg/**
    - ~/.config/gcloud/**
    - ~/.kube/**
    - ~/.docker/config.json
    - ~/.netrc
    - ~/.npmrc
    - ~/.pypirc
    - ~/.git-credentials
    - **/.env
    - **/.env.*
    - ~/Library/Keychains/**

network:
  allow:
    - *.github.com
    - *.githubusercontent.com
    - api.anthropic.com
    - api.openai.com
    - codeload.github.com
    - crates.io
    - files.pythonhosted.org
    - generativelanguage.googleapis.com
    - get.pnpm.io
    - github.com
    - openrouter.ai
    - proxy.golang.org
    - pypi.org
    - registry.npmjs.org
    - registry.yarnpkg.com
    - static.crates.io
  deny: []
  deny_all_other: true

process:
  deny:
    - ssh
    - scp
    - aws
    - gcloud
    - kubectl

on_violation: block+receipt
