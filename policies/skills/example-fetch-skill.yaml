# Example reviewed skill policy.
#
# Skill:   example "fetch and summarize a URL" skill (illustrative).
# Source:  https://example.com/skills/fetch  (placeholder)
# Derived: `driftward profile ./fetch-skill.sh` on 2026-08-30, then reviewed.
# Review:  the skill needs to reach the public web to fetch pages and its
#          model provider to summarize. It has no reason to read credentials or
#          spawn shells, so those stay denied. The allow-list is intentionally
#          narrow; widen it only for hosts you have verified.
name: example-fetch-skill
description: Reviewed least-privilege policy for the example fetch-and-summarize skill.

filesystem:
  read:
    - ./
    - ~/.gitconfig
  write:
    - ./
    - /tmp/**
  deny:
    - ~/.ssh/**
    - ~/.aws/**
    - ~/.gnupg/**
    - "**/.env"
    - ~/Library/Keychains/**

network:
  allow:
    - api.anthropic.com        # provider used to summarize
    - example.com              # the site the skill fetches (replace with real)
  deny: []
  deny_all_other: true

process:
  deny:
    - ssh
    - aws
    - kubectl

on_violation: block+receipt
