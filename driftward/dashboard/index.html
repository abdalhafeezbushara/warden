<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Driftward Security Console</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to dashboard</a>
  <header class="topbar">
    <a class="brand" href="#overview" aria-label="Driftward overview">
      <span class="brand-mark"><img src="/favicon.svg" alt="" width="23" height="23" /></span>
      <span><strong>Driftward</strong><small>Developer security console</small></span>
    </a>
    <nav class="tabs" aria-label="Dashboard views">
      <button data-view="overview" class="active" aria-current="page">Overview</button>
      <button data-view="behavior">Behavior</button>
      <button data-view="sessions">Sessions</button>
    </nav>
    <div class="right">
      <label class="live"><input type="checkbox" id="live" checked /> Auto-refresh</label>
      <span class="local-badge" title="This read-only console is bound to loopback"><span></span> Local only</span>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <div class="loading"><span class="spinner"></span> Loading security posture…</div>
  </main>

  <footer class="foot">
    <span id="footstat">Connecting…</span>
    <span>Read-only · data stays on this machine</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
